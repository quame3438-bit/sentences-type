<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>影视英语句型练习</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#182436;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#153c72;color:#fff;padding:22px 16px}header h1{font-size:23px;margin:0 0 8px}header p{margin:0;opacity:.85;font-size:14px}main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:13px;box-shadow:0 3px 14px #16335712}h2{font-size:18px;margin:0 0 13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,input,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #cbd5e1;min-width:0}select{flex:1;max-width:100%;background:white}button{background:#2466cb;color:#fff;border:0;cursor:pointer}button.sub{background:#e7eefb;color:#204573}button.danger{background:#fff0f0;color:#a52222}.sentence{font-size:24px;line-height:1.5;font-weight:650;margin:17px 0 8px;overflow-wrap:anywhere}.zh{font-size:18px;line-height:1.55;color:#334b67}.meta{font-size:13px;color:#66778d;margin-top:9px}.tip{color:#63758b;font-size:13px;line-height:1.6}.count{font-size:14px;color:#5d708a}.entry{border-top:1px solid #e8edf5;padding:12px 0}.entry strong{display:block;font-size:17px;margin:5px 0}.entry small{color:#64748b}.entry .row{margin-top:8px}.badge{font-size:12px;border-radius:7px;padding:4px 8px;background:#edf4ff;color:#245da3}.hide{display:none}button:disabled{opacity:.55}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1d365a;color:white;border-radius:9px;padding:10px 14px;display:none;max-width:90%;z-index:9}@media(max-width:520px){.sentence{font-size:21px}main{padding:9px}.card{padding:13px}button{padding:10px 9px}}</style></head><body><header><h1>🎬 影视英语句型练习</h1><p>从基础到高级 · 影视短台词 · 点击更新 · 自动保存</p></header><main><section class="card"><h2>① 选择句型</h2><div class="row"><select id="group" aria-label="难度分组"></select><select id="pattern" aria-label="句型"></select></div><p class="tip">可选择某一种句型专项练习，也可以选择「全部句型」随机练习。</p></section><section class="card"><h2>② 每次学习一句</h2><div class="row"><button id="next">🔄 更新一句</button><button id="speak" class="sub">🔊 英语朗读</button></div><div class="sentence" id="english">点击「更新一句」开始学习</div><div class="zh" id="chinese"></div><div class="meta" id="origin"></div><p class="tip">影视作品名称用于帮助辨认出处；短台词可能存在版本差异。朗读为系统语音，并非影视原声。</p><div class="count" id="seenCount"></div></section><section class="card"><h2>③ 自动保存的句子</h2><button id="historyToggle" class="sub">展开记录 ▼</button><div id="historyBox" class="hide"><p class="tip">每次出现的句子都会自动保存。再次抽到同一句，会移到记录顶部。</p><input id="filter" style="width:100%" placeholder="搜索英语、中文、句型或影视名称"><p id="historyCount" class="count"></p><div id="history"></div></div></section><section class="card"><h2>④ 导入 / 导出备份</h2><div class="row"><button id="export">📤 导出备份 JSON</button><button id="import" class="sub">📥 导入备份 JSON</button><input id="file" type="file" accept=".json,application/json" hidden></div><p class="tip">数据保存在当前浏览器本机。更换手机、清除网站数据可能丢失记录，请定期导出备份。导入备份会覆盖现有记录。</p></section></main><div id="toast" role="status"></div><script>const BANK=[{"group":"基础句型","pattern":"主谓结构 SV","en":"I volunteer as tribute.","film":"The Hunger Games","zh":"我自愿代替她。"},{"group":"基础句型","pattern":"主谓结构 SV","en":"I am Groot.","film":"Guardians of the Galaxy","zh":"我是格鲁特。"},{"group":"基础句型","pattern":"主系表 SVC","en":"Life is like a box of chocolates.","film":"Forrest Gump","zh":"人生就像一盒巧克力。"},{"group":"基础句型","pattern":"主系表 SVC","en":"I am your father.","film":"The Empire Strikes Back","zh":"我是你的父亲。"},{"group":"基础句型","pattern":"主谓宾 SVO","en":"I see dead people.","film":"The Sixth Sense","zh":"我能看见死人。"},{"group":"基础句型","pattern":"主谓宾 SVO","en":"I love you.","film":"Star Wars: The Empire Strikes Back","zh":"我爱你。"},{"group":"基础句型","pattern":"主谓双宾 SVOO","en":"Show me the money!","film":"Jerry Maguire","zh":"让我看看钱！"},{"group":"基础句型","pattern":"主谓双宾 SVOO","en":"Give me a break.","film":"The Emperor’s New Groove","zh":"饶了我吧。"},{"group":"基础句型","pattern":"主谓宾补 SVOC","en":"You had me at hello.","film":"Jerry Maguire","zh":"你一开口就打动了我。"},{"group":"基础句型","pattern":"主谓宾补 SVOC","en":"Make it so.","film":"Star Trek: The Next Generation","zh":"照办。"},{"group":"基础句型","pattern":"There be 存在句","en":"There is no spoon.","film":"The Matrix","zh":"根本没有勺子。"},{"group":"基础句型","pattern":"There be 存在句","en":"There’s no place like home.","film":"The Wizard of Oz","zh":"没有任何地方比得上家。"},{"group":"基础句型","pattern":"祈使句","en":"May the Force be with you.","film":"Star Wars","zh":"愿原力与你同在。"},{"group":"基础句型","pattern":"祈使句","en":"Just keep swimming.","film":"Finding Nemo","zh":"继续游，别停。"},{"group":"基础句型","pattern":"一般疑问句","en":"Are you talking to me?","film":"Taxi Driver","zh":"你是在跟我说话吗？"},{"group":"基础句型","pattern":"一般疑问句","en":"Do you feel lucky?","film":"Dirty Harry","zh":"你觉得自己幸运吗？"},{"group":"基础句型","pattern":"特殊疑问句","en":"Why so serious?","film":"The Dark Knight","zh":"干吗这么严肃？"},{"group":"基础句型","pattern":"特殊疑问句","en":"What’s in the box?","film":"Se7en","zh":"盒子里是什么？"},{"group":"基础句型","pattern":"否定句","en":"I don’t know.","film":"The Room","zh":"我不知道。"},{"group":"基础句型","pattern":"否定句","en":"You know nothing, Jon Snow.","film":"Game of Thrones","zh":"你什么都不懂，琼恩·雪诺。"},{"group":"基础句型","pattern":"感叹句","en":"What a day!","film":"Mad Max: Fury Road","zh":"多么精彩的一天！"},{"group":"基础句型","pattern":"感叹句","en":"How rude!","film":"Full House","zh":"真没礼貌！"},{"group":"时态与语态","pattern":"一般现在时","en":"Winter is coming.","film":"Game of Thrones","zh":"凛冬将至。"},{"group":"时态与语态","pattern":"一般现在时","en":"Life moves pretty fast.","film":"Ferris Bueller’s Day Off","zh":"人生过得真快。"},{"group":"时态与语态","pattern":"一般过去时","en":"I was there.","film":"The Lord of the Rings: The Fellowship of the Ring","zh":"我当时就在场。"},{"group":"时态与语态","pattern":"一般过去时","en":"I knew it.","film":"Star Wars: The Empire Strikes Back","zh":"我就知道。"},{"group":"时态与语态","pattern":"一般将来时","en":"I’ll be back.","film":"The Terminator","zh":"我会回来的。"},{"group":"时态与语态","pattern":"一般将来时","en":"I’ll have what she’s having.","film":"When Harry Met Sally...","zh":"我也要一份她点的。"},{"group":"时态与语态","pattern":"现在进行时","en":"I’m walking here!","film":"Midnight Cowboy","zh":"我正在过马路呢！"},{"group":"时态与语态","pattern":"现在进行时","en":"We’re gonna need a bigger boat.","film":"Jaws","zh":"我们得弄条更大的船。"},{"group":"时态与语态","pattern":"过去进行时","en":"I was just leaving.","film":"Casablanca","zh":"我正准备离开。"},{"group":"时态与语态","pattern":"过去进行时","en":"I was wondering...","film":"Notting Hill","zh":"我刚才在想……"},{"group":"时态与语态","pattern":"现在完成时","en":"I’ve made a huge mistake.","film":"Arrested Development","zh":"我犯了个大错。"},{"group":"时态与语态","pattern":"现在完成时","en":"I’ve seen things you people wouldn’t believe.","film":"Blade Runner","zh":"我见过你们难以置信的景象。"},{"group":"时态与语态","pattern":"被动语态","en":"You have been chosen.","film":"Toy Story","zh":"你被选中了。"},{"group":"时态与语态","pattern":"被动语态","en":"The game is rigged.","film":"The Wire","zh":"这场游戏被操纵了。"},{"group":"复杂句型","pattern":"宾语从句","en":"I think this is the beginning of a beautiful friendship.","film":"Casablanca","zh":"我想这是一段美好友谊的开始。"},{"group":"复杂句型","pattern":"宾语从句","en":"I know what you did last summer.","film":"I Know What You Did Last Summer","zh":"我知道你去年夏天做了什么。"},{"group":"复杂句型","pattern":"定语从句","en":"You’re the one that I want.","film":"Grease","zh":"你就是我想要的那个人。"},{"group":"复杂句型","pattern":"定语从句","en":"This is the way.","film":"The Mandalorian","zh":"这就是正道。"},{"group":"复杂句型","pattern":"时间状语从句","en":"When you wish upon a star...","film":"Pinocchio","zh":"当你向星星许愿时……"},{"group":"复杂句型","pattern":"时间状语从句","en":"When you play the game of thrones, you win or you die.","film":"Game of Thrones","zh":"玩权力的游戏，要么赢，要么死。"},{"group":"复杂句型","pattern":"条件状语从句","en":"If you build it, he will come.","film":"Field of Dreams","zh":"如果你建好，他就会来。"},{"group":"复杂句型","pattern":"条件状语从句","en":"If you’re a bird, I’m a bird.","film":"The Notebook","zh":"如果你是鸟，我也是鸟。"},{"group":"复杂句型","pattern":"原因与结果","en":"Because I said so.","film":"Because I Said So","zh":"因为我说了算。"},{"group":"复杂句型","pattern":"原因与结果","en":"That’s why they call it the present.","film":"Kung Fu Panda","zh":"所以它才叫礼物（当下）。"},{"group":"复杂句型","pattern":"让步与转折","en":"Even though you’re growing up, you should never stop having fun.","film":"Wonder","zh":"即使长大了，也不要停止享受快乐。"},{"group":"复杂句型","pattern":"让步与转折","en":"But I’m a cheerleader.","film":"But I’m a Cheerleader","zh":"可我是啦啦队员啊。"},{"group":"复杂句型","pattern":"比较句","en":"You’re gonna need a bigger boat.","film":"Jaws","zh":"你得要一条更大的船。"},{"group":"复杂句型","pattern":"比较句","en":"My precious.","film":"The Lord of the Rings: The Two Towers","zh":"我的宝贝。"},{"group":"高级表达","pattern":"虚拟语气","en":"If I were you, I’d take it.","film":"The Devil Wears Prada","zh":"如果我是你，我会接受。"},{"group":"高级表达","pattern":"虚拟语气","en":"I wish I knew how to quit you.","film":"Brokeback Mountain","zh":"我真希望知道怎样才能放下你。"},{"group":"高级表达","pattern":"倒装句","en":"Never have I ever...","film":"Never Have I Ever","zh":"我从来没有……"},{"group":"高级表达","pattern":"倒装句","en":"So be it.","film":"Star Wars: Return of the Jedi","zh":"那就这样吧。"},{"group":"高级表达","pattern":"强调句","en":"It’s you. It’s always been you.","film":"The Vampire Diaries","zh":"是你，一直都是你。"},{"group":"高级表达","pattern":"强调句","en":"You can’t handle the truth!","film":"A Few Good Men","zh":"你承受不了真相！"},{"group":"高级表达","pattern":"反意疑问句","en":"You’re coming, aren’t you?","film":"Friends","zh":"你会来的，对吧？"},{"group":"高级表达","pattern":"反意疑问句","en":"It’s a beautiful day, isn’t it?","film":"The Truman Show","zh":"天气真好，不是吗？"},{"group":"高级表达","pattern":"间接疑问句","en":"Can you tell me where I am?","film":"The Matrix","zh":"你能告诉我我在哪儿吗？"},{"group":"高级表达","pattern":"间接疑问句","en":"I wonder what’s going to happen.","film":"Stranger Things","zh":"我想知道接下来会发生什么。"},{"group":"高级表达","pattern":"不定式结构","en":"To infinity and beyond!","film":"Toy Story","zh":"飞向宇宙，浩瀚无垠！"},{"group":"高级表达","pattern":"不定式结构","en":"I want to be alone.","film":"Grand Hotel","zh":"我想一个人待着。"},{"group":"高级表达","pattern":"动名词结构","en":"Just keep swimming.","film":"Finding Nemo","zh":"继续游，别停。"},{"group":"高级表达","pattern":"动名词结构","en":"There’s no crying in baseball!","film":"A League of Their Own","zh":"棒球场上不许哭！"},{"group":"高级表达","pattern":"情态动词","en":"You shall not pass!","film":"The Lord of the Rings: The Fellowship of the Ring","zh":"你休想通过！"},{"group":"高级表达","pattern":"情态动词","en":"You must unlearn what you have learned.","film":"Star Wars: The Empire Strikes Back","zh":"你必须忘掉以前学到的东西。"},{"group":"高级表达","pattern":"省略与口语短句","en":"As if!","film":"Clueless","zh":"想得美！"},{"group":"高级表达","pattern":"省略与口语短句","en":"No way.","film":"Spider-Man: No Way Home","zh":"不可能。"},{"group":"高级表达","pattern":"习语与固定搭配","en":"Break a leg!","film":"Glee","zh":"祝你好运！"},{"group":"高级表达","pattern":"习语与固定搭配","en":"It’s not rocket science.","film":"The Big Bang Theory","zh":"这又不是什么高深的事。"}];
const KEY='movie_sentence_trainer_v1';
const $=id=>document.getElementById(id);
let state={seen:[],current:null,group:'全部',pattern:'全部'};
try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&Array.isArray(old.seen))state={...state,...old}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('保存失败：浏览器存储不可用，请导出备份')}}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2500)}
function option(select,value,text){const x=document.createElement('option');x.value=value;x.textContent=text;select.append(x)}
const groups=['全部',...new Set(BANK.map(x=>x.group))];
function init(){const g=$('group');groups.forEach(x=>option(g,x,x));g.value=groups.includes(state.group)?state.group:'全部';state.group=g.value;renderPatterns();$('pattern').value=[...$('pattern').options].some(o=>o.value===state.pattern)?state.pattern:'全部';state.pattern=$('pattern').value;renderCurrent();renderHistory()}
function renderPatterns(){const p=$('pattern'),prev=state.pattern;p.replaceChildren();option(p,'全部','全部句型（随机）');[...new Set(BANK.filter(x=>state.group==='全部'||x.group===state.group).map(x=>x.pattern))].forEach(x=>option(p,x,x));p.value=[...p.options].some(o=>o.value===prev)?prev:'全部';state.pattern=p.value}
$('group').onchange=e=>{state.group=e.target.value;state.pattern='全部';renderPatterns();save()};$('pattern').onchange=e=>{state.pattern=e.target.value;save()};
function eligible(){return BANK.map((x,i)=>({...x,id:i})).filter(x=>(state.group==='全部'||x.group===state.group)&&(state.pattern==='全部'||x.pattern===state.pattern))}
function next(){const all=eligible();if(!all.length)return;const shown=new Set(state.seen.map(x=>x.id));let pool=all.filter(x=>!shown.has(x.id));if(!pool.length){pool=all;toast('本分类全部看过，开始随机复习')}if(pool.length>1&&state.current!==null)pool=pool.filter(x=>x.id!==state.current).length?pool.filter(x=>x.id!==state.current):pool;const chosen=pool[Math.floor(Math.random()*pool.length)];state.current=chosen.id;if(!shown.has(chosen.id)){state.seen.unshift({id:chosen.id,at:new Date().toISOString()})}else{const pos=state.seen.findIndex(x=>x.id===chosen.id);if(pos>=0){const [entry]=state.seen.splice(pos,1);entry.at=new Date().toISOString();state.seen.unshift(entry)}}save();renderCurrent();renderHistory()}
function renderCurrent(){const item=BANK[state.current];$('english').textContent=item?.en||'点击「更新一句」开始学习';$('chinese').textContent=item?.zh||'';$('origin').textContent=item?`句型：${item.pattern} · 影视作品：${item.film}`:'';$('seenCount').textContent=`已保存 ${state.seen.length} 句 / 题库 ${BANK.length} 句 · ${new Set(BANK.map(x=>x.pattern)).size} 种句型`}
$('next').onclick=next;$('speak').onclick=()=>{const t=BANK[state.current]?.en;if(!t)return;if(!window.speechSynthesis){toast('当前浏览器不支持朗读');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)};
$('historyToggle').onclick=()=>{$('historyBox').classList.toggle('hide');$('historyToggle').textContent=$('historyBox').classList.contains('hide')?'展开记录 ▼':'收起记录 ▲'};
$('filter').oninput=renderHistory;
function renderHistory(){const box=$('history'),query=$('filter').value.trim().toLowerCase();box.replaceChildren();let found=0;for(const rec of state.seen){const x=BANK[rec.id];if(!x)continue;if(query&&!`${x.en} ${x.zh} ${x.film} ${x.pattern}`.toLowerCase().includes(query))continue;found++;const d=document.createElement('div');d.className='entry';const tag=document.createElement('span');tag.className='badge';tag.textContent=x.pattern;const en=document.createElement('strong');en.textContent=x.en;const zh=document.createElement('div');zh.textContent=x.zh;const meta=document.createElement('small');meta.textContent=`${x.film} · ${new Date(rec.at).toLocaleString()}`;const row=document.createElement('div');row.className='row';const open=document.createElement('button');open.className='sub';open.textContent='查看这句';open.onclick=()=>{state.current=rec.id;save();renderCurrent();window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='danger';del.textContent='删除记录';del.onclick=()=>{if(!confirm('删除这句学习记录？'))return;state.seen=state.seen.filter(y=>y.id!==rec.id);save();renderHistory();renderCurrent()};row.append(open,del);d.append(tag,en,zh,meta,row);box.append(d)}$('historyCount').textContent=`共 ${found} 条`;if(!found){const e=document.createElement('p');e.className='tip';e.textContent='暂无符合条件的学习记录。';box.append(e)}}
$('export').onclick=()=>{const payload={app:'movie-sentence-trainer',version:1,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='影视英语句型备份_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='movie-sentence-trainer'||!Array.isArray(data.state?.seen))throw Error('不是本网页的有效备份');if(!confirm('导入将覆盖当前保存的学习记录，确定继续？'))return;const clean=data.state.seen.filter(x=>Number.isInteger(x.id)&&x.id>=0&&x.id<BANK.length&&typeof x.at==='string');const ids=new Set();state={seen:clean.filter(x=>{if(ids.has(x.id))return false;ids.add(x.id);return true}),current:Number.isInteger(data.state.current)&&data.state.current>=0&&data.state.current<BANK.length?data.state.current:null,group:groups.includes(data.state.group)?data.state.group:'全部',pattern:typeof data.state.pattern==='string'?data.state.pattern:'全部'};save();init();toast('备份导入成功')}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};
init();</script></body></html>
